<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../src/output.css">
    <link
      rel="icon"
      href="../img/Neon Faravahar Cybertech Emblem.png"
      type="image/x-icon"
    />
    <title>ثبت نام | Parsi Electronic </title>
    <script src="../Js/registerLogin.js" defer></script>
</head>
<body>

    <div class="min-h-screen flex flex-col md:flex-row  gap-20 items-center justify-center bg-[#171717]">

<div class="text-center mb-10">
 <img class="w-20 h-20 mx-auto mb-6" src="../img/Neon Faravahar Cybertech Emblem.png" alt="لوگو سایت">

<h1 class="text-2xl font-bold text-white">ثبت نام در پارسی الکترونیک</h1>
<p class="text-sm text-gray-400 mt-4">به دنیای سیستم های گیمینگ خوش آمدید</p>
</div>

<form class="space-y-4 " id="registerForm" >

<div>

    <label class="text-sm font-medium block text-gray-300 mb-2">نام کاربری:</label>
<input class="w-full bg-[#171717] text-white border border-gray-700 rounded-lg px-4 py-3" type="text"
 id="regUserN" maxlength="12" placeholder=" نام کاربری خود را وارد کنید" required>

</div>



<div>

    <label class="text-sm font-medium block text-gray-300 mb-2">ایمیل:</label>
<input class="w-full bg-[#171717] text-white border border-gray-700 rounded-lg px-4 py-3" type="email"
 id="regUserE" placeholder="example@email.com" dir="ltr" required>

</div>



 <div>
     <label class=" text-sm font-medium block text-gray-300 mb-2">رمز عبور:</label>
     <div class="flex text-center justify-center gap-6 items-center">
      <button type="button" id="togell">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24px" height="24px" viewBox="0 0 36 36" aria-hidden="true" role="img" class="iconify iconify--twemoji" preserveAspectRatio="xMidYMid meet"><ellipse fill="#F5F8FA" cx="8.828" cy="18" rx="7.953" ry="13.281"/><path fill="#E1E8ED" d="M8.828 32.031C3.948 32.031.125 25.868.125 18S3.948 3.969 8.828 3.969S17.531 10.132 17.531 18s-3.823 14.031-8.703 14.031zm0-26.562C4.856 5.469 1.625 11.09 1.625 18s3.231 12.531 7.203 12.531S16.031 24.91 16.031 18S12.8 5.469 8.828 5.469z"/><circle fill="#8899A6" cx="6.594" cy="18" r="4.96"/><circle fill="#292F33" cx="6.594" cy="18" r="3.565"/><circle fill="#F5F8FA" cx="7.911" cy="15.443" r="1.426"/><ellipse fill="#F5F8FA" cx="27.234" cy="18" rx="7.953" ry="13.281"/><path fill="#E1E8ED" d="M27.234 32.031c-4.88 0-8.703-6.163-8.703-14.031s3.823-14.031 8.703-14.031S35.938 10.132 35.938 18s-3.824 14.031-8.704 14.031zm0-26.562c-3.972 0-7.203 5.622-7.203 12.531c0 6.91 3.231 12.531 7.203 12.531S34.438 24.91 34.438 18S31.206 5.469 27.234 5.469z"/><circle fill="#8899A6" cx="25" cy="18" r="4.96"/><circle fill="#292F33" cx="25" cy="18" r="3.565"/><circle fill="#F5F8FA" cx="26.317" cy="15.443" r="1.426"/></svg>
</button>
        
 <input type="password" id="regUserP" required minlength="8" maxlength="22"
            class="w-full bg-[#171717] text-white border border-gray-700 rounded-lg px-4 py-3" 
            placeholder="07826532fF" dir="ltr" />

       
     </div>
 </div>


  <div>
          <label class=" text-sm font-medium block text-gray-300 mb-2">تکرار رمز عبور:</label>
          <input type="password" id="regUserConfirmP" required minlength="8"
            class="w-full bg-[#171717] text-white border border-gray-700 rounded-lg px-4 py-3" 
            dir="ltr" />
        </div>


        <span id="Ermasg" class="hidden text-sm text-red-500 text-center">خطا</span>


        <button class="text-white bg-[#1683ff] hover:bg-[#0066D6] font-bold py-3  w-full  rounded-lg transition duration-500 mt-4 shadow-lg" type="submit">
            ثبت نام
        </button>


        <p class="text-center text-sm text-gray-400 mt-6">حساب دارید؟
        
        <a class="font-bold text-[#1683ff]" href="./login.html">وارد شوید</a>
        
        </p>

</form>



    </div>


    
</body>
</html>
