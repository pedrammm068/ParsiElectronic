<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../src/output.css" />
    <link
      rel="icon"
      href="../img/Neon Faravahar Cybertech Emblem.png"
      type="image/x-icon"
    />
    <title>درگاه پرداخت</title>
    <script src="../Js/checkout.js" defer></script>
  </head>
  <body>

    <div class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
        
      <div
        class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-gray-100"
      >
     
        <div class="text-black bg-[#FFD700] text-center relative">

            <div class="flex items-center p-4 justify-between">

  <div class="flex items-center justify-center gap-2 mb-4">
                <img
                  class="w-12 h-12"
                  src="../img/dybug_payment_zarinpal.svg"
                  alt="زرین پال"
                />
                <h1 class="font-bold">درگاه پرداخت (نسخه پروژه)</h1>
              </div>


                <div class="flex items-center justify-cente gap-2 bg-black/15 rounded-2xl p-2 mb-4"> 
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24px"
                  height="24px"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21Z"
                    stroke="#000000"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M12 6V12"
                    stroke="#000000"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M16.24 16.24L12 12"
                    stroke="#000000"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="font-mono" id="timer">00:30</span>
           </div>
          
      
            
            </div>


            <p class="text-xs font-bold">پارسی الکترونیک</p>
            </div>


      <div class="p-6">
        <div class="text-center mb-8">
          <p class="text-gray-500 text-sm mb-2">مبلغ قابل پرداخت:</p>
          <span id="final-price" class="text-2xl font-bold text-gray-800"
            >0 تومان </span
          >
        </div>

        <div class="space-y-5">
          <div class="">
<label class="block text-sm font-medium  text-gray-600 text-right mb-4" for="">شماره کارت:</label>
<input class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-4 text-center text-lg font-mono transition-all" placeholder="**** **** **** ****" dir="ltr" id="cart-num" type="text" maxlength="19">
    <div class="mt-2" id="toast"></div>
<div class="flex gap-6">
 
<div class="w-1/2">
<label class="block text-sm font-medium  text-gray-600 text-right mb-4"  for="">تاریخ انقضا: </label>
<input class="w-full bg-gray-50 border border-gray-300 rounded-xl px-2 py-2  text-lg font-mono transition-all" maxlength="4" dir="ltr" placeholder="MM/YY" type="text">

</div>

<div class="w-1/2">
<label class="block text-sm font-medium  text-gray-600 text-right mb-4"  for="">CVV2:</label>
<input class="w-full bg-gray-50 border border-gray-300 rounded-xl px-2 py-2  text-lg font-mono transition-all" maxlength="4" dir="ltr" type="text">

</div>
</div>


<div>
    <label class="block text-sm font-medium  text-gray-600 text-right mb-4" for="">رمز دوم (پویا) :</label>
    <input placeholder="رمز دوم خود را وارد کنید"  class="w-full bg-gray-50 border border-gray-300 rounded-xl px-2 py-2  text-lg font-mono transition-all" type="password">
</div>

          </div>
<div class="flex gap-4">

    <div id="pay-btn"  class="w-full cursor-pointer bg-[#FFD700] hover:bg-yellow-500 text-black font-bold py-4 rounded-xl  mt-8  transition duration-500  shadow-xl flex items-center  justify-center gap-4 ">
<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
<span>پرداخت مبلغ</span>
    </div>

    <div id="can-btn" class="w-full cursor-pointer bg-[#d60808] hover:bg-red-800 text-black font-bold py-4 rounded-xl  mt-8  transition duration-500  shadow-xl flex items-center  justify-center gap-4 ">

      <span> انصراف و بازگشت</span>
    </div>
</div>



        </div>
      </div>
    </div>
    
      </div>
      
  </body>
</html>
