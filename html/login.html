<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../src/output.css">
    <link
      rel="icon"
      href="../img/Neon Faravahar Cybertech Emblem.png"
      type="image/x-icon"
    />
    <title>ورود | Parsi Electronic </title>
    <script src="../Js/registerLogin.js" defer></script>
</head>
<body>

    <div class="min-h-screen flex gap-20 items-center justify-center bg-[#171717]">

<div class="text-center mb-10">
 <img class="w-20 h-20 mx-auto mb-6" src="../img/Neon Faravahar Cybertech Emblem.png" alt="لوگو سایت">

<h1 class="text-2xl font-bold text-white">ورود به حساب کاربری</h1>
<p class="text-sm text-gray-400 mt-4">برای استفاده از امکانات وارد شوید</p>
</div>

<form class="space-y-4" id="loginForm" >




<div>

    <label class="text-sm font-medium block text-gray-300 mb-2">ایمیل:</label>
<input class="w-full bg-[#171717] text-white border border-gray-700 rounded-lg px-4 py-3" type="email"
 id="LogUserE" placeholder="example@email.com" dir="ltr" required>

</div>



 <div>
     <label class=" text-sm font-medium block text-gray-300 mb-2">رمز عبور:</label>
 <input type="password" id="LogUserP" required minlength="8"
            class="w-full bg-[#171717] text-white border border-gray-700 rounded-lg px-4 py-3" 
            placeholder="07826532fF" dir="ltr" />
</div>


        <span id="ErmasgLog" class="hidden text-sm text-red-500 text-center">خطا</span>


        <button class="text-white bg-[#1683ff] hover:bg-[#0066D6] font-bold py-3  w-full  rounded-lg transition duration-500 mt-4 shadow-lg" type="submit">
            ورود
        </button>


        <p class="text-center text-sm text-gray-400 mt-6">حساب کاربری ندارید؟
        <a class="font-bold text-[#1683ff]" href="./register.html">ثبت نام کنید</a>
        
        </p>

</form>



    </div>


    
</body>
</html>
